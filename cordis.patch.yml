# Cordis Profile Patch para DeepSick Hardness (DSH) — Stack Real Robert
# Topología Calibrada: Gemini (Workhorse 95%) + Mistral/Venice (Estratégico Sin Guardrails) + DeepSeek Direct + Sovereign Guard Suite

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # Provider 1: 9router KVM4 (Gateway Soberano)
      karen-9router:
        displayName: Karen 9router Gateway
        apiKeyEnv: NINEROUTER_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:20128/v1
        compat:
          thinkingFormat: openai
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          supportsStore: false
        models:
          # --- 🚀 WORKHORSE REAL (95% DE LA TALACHA, CODING Y CONTEXTO 1M) ---
          - id: ag/gemini-3.7-flash-high
            name: Gemini 3.7 Flash High (Talacha Pesada / 1M Ctx / Coding Masivo / Cero Quema)
            contextWindow: 1048576
          - id: ag/gemini-3.6-flash-high
            name: Gemini 3.6 Flash High (Velocidad / Triage / Scripting)
            contextWindow: 1048576
          - id: ag/gemini-3.1-pro-low
            name: Gemini 3.1 Pro (Razonamiento de Código Extenso)
            contextWindow: 1048576

          # --- 🎯 DEEPSEEK VIA 9ROUTER (SOBERANO / SIN CENSURA) ---
          - id: ds/deepseek-v4-pro
            name: DeepSeek V4 Pro (9router Gateway / Soberano / Sin Censura)
            contextWindow: 1000000
          - id: ds/deepseek-chat
            name: DeepSeek V3 Chat (9router)
            contextWindow: 128000
          - id: ds/deepseek-reasoner
            name: DeepSeek R1 Reasoner (9router)
            contextWindow: 128000

          # --- 🎯 MISTRAL: USO ESTRATÉGICO SIN GUARDRAILS (NO TALACHA) ---
          - id: mistral/mistral-medium-3-5
            name: Mistral Medium 3.5 (Estratégico / Baja Censura / Bypass Inteligente)
            contextWindow: 128000
          - id: mistral/codestral-latest
            name: Codestral Latest (Sintaxis Compleja / Baja Censura)
            contextWindow: 256000

          # --- 🏛️ ANTHROPIC (<5% USO MARGINAL) ---
          - id: ag/claude-sonnet-4-6
            name: Claude Sonnet 4.6 (Auditoría Marginal / Solo Casos Aislados)
            contextWindow: 1000000

      # Provider 2: Venice AI (Bypass Uncensored Absoluto / Inyección Quirúrgica <4k)
      venice-ai:
        displayName: Venice AI (Zero Guardrails / Snippets Quirúrgicos)
        apiKeyEnv: VENICE_API_KEY
        api: openai-completions
        baseURL: https://api.venice.ai/api/v1
        compat:
          supportsStore: false
        models:
          - id: olafangensan-glm-4.7-flash-heretic
            name: GLM-4.7 Flash Heretic (Uncensored / Zero Guardrail)
            contextWindow: 32000
          - id: venice-uncensored-1-2
            name: Venice Uncensored 1.2
            contextWindow: 32000

      # Provider 3: DeepSeek Oficial Directo (R1 Reasoner / Fallback)
      deepseek-direct:
        displayName: DeepSeek Official API
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: https://api.deepseek.com
        compat:
          supportsStore: false
        models:
          - id: deepseek-chat
            name: DeepSeek V3 Official
          - id: deepseek-reasoner
            name: DeepSeek R1 Official (Razonamiento Algorítmico)

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
    instructionFileCandidates:
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: true
    persona: |
      You are an autonomous systems and coding engine executing with model {{model}} in {{cwd}}.
      Operational mode: Direct, empirical MX engineering. Zero sycophancy, zero empty apologies.
      Always verify code and states empirically before confirming.

# --- 🛡️ SOVEREIGN GUARD & MIDDLEWARE SUITE ---
- insert:
    - id: sovereign-guard
      name: '@deepseek-ai/dsh-sovereign-guard'
      config:
        contextIsolator:
          enabled: true
          rules:
            - pattern: '*venice*'
              maxTurns: 4
              maxInputChars: 16000
            - pattern: '*heretic*'
              maxTurns: 4
              maxInputChars: 16000
            - pattern: '*mistral*'
              maxTurns: 8
              maxInputChars: 64000
            - pattern: '*codestral*'
              maxTurns: 8
              maxInputChars: 64000
            - pattern: '*deepseek*'
              maxTurns: 8
              maxInputChars: 80000
            - pattern: '*ds/*'
              maxTurns: 8
              maxInputChars: 80000
            - pattern: '*claude*'
              maxTurns: 6
              maxInputChars: 80000
            - pattern: '*gemini*'
              maxTurns: 8
              maxInputChars: 120000
        spillGuard:
          enabled: true
          maxLines: 150
          maxBytes: 12288
          headLines: 25
          tailLines: 25
          stagingDir: _archive/staging/spills
          semanticExcerpting: true
        decisionInterceptor:
          enabled: true
          brainDbPath: data/brain.db
          autoResolveSafe: true
          confidenceThreshold: 0.85
          autoSelectRecommended: true
          maxConsecutiveReads: 4
        rozEngine:
          enabled: true
          stagingDir: _archive/staging
          retentionHours: 48
          versioningEnabled: true
        thermalModulator:
          enabled: true
          baseTemperature: 0.2
          minTemperature: 0.05
          maxTemperature: 1.0
          feedbackDriven: true
        reflexiveAuditor:
          enabled: true
          intervalTurns: 3
          maxAuditsPerSession: 20
        optimizer:
          enabled: true
          cache:
            enabled: true
            ttlMs: 3600000
          tools:
            maxParallel: 8
        telemetry:
          enabled: true
          prometheusExporter: true
          anomalyDetection: true
        qualityAuditor:
          enabled: true
          minPassingScore: 85
        keepAlive:
          enabled: true
          intervalMs: 15000
        stepFeedback:
          enabled: true
          includeToolPills: true
          hotSteeringEnabled: true
        toneGovernor:
          enabled: true
          stripSycophancy: true
          enforceEmpiricalFact: true
          enforceDirectMX: true
        synthesizer:
          enabled: true
          maxRawCharsThreshold: 1500
          fallbackToLocalAST: true
        graphify:
          enabled: true
          graphPath: .graphify/graph.json
        intentRadar:
          enabled: true
          antiTunnelVision: true
        attentionAnchor:
          enabled: true
          lockGoalImmutability: true
        executiveCognition:
          enabled: true
          enforceEmpiricalDeduction: true
        progressStream:
          enabled: true
          rateLimitMs: 200
          maxVisiblePills: 2
          ephemeralTtlMs: 3000
          coalesceThreshold: 3
        voiceGateway:
          enabled: true
          provider: auto_failover
          dialect: es-MX

    # --- 🎙️ RITA SUITE (PERSONA, VOZ, TONO & IDENTIDAD CONVERSACIONAL) ---
    - id: rita-suite
      name: '@deepseek-ai/dsh-rita-suite'
      config:
        voice:
          enabled: true
          defaultProvider: cartesia
          speechAnnouncementForTools: true
          stripMarkdownSyntax: true
          cartesiaProfile:
            modelId: sonic-2024-12-12
            voiceId: 421b3369-f63f-4b03-8980-37a44df1d4e8
            speed: 1.05
            emotion: positivity
            emotionIntensity: high
            language: es
            outputFormat:
              container: raw
              encoding: pcm_s16le
              sampleRate: 24000
        voiceGuard:
          enabled: true
        toneGovernor:
          enabled: true
          stripSycophancy: true
          enforceDirectMX: true
          enforceEmpiricalFact: true
        rozEngine:
          enabled: true
          stagingDir: _archive/staging/rita
          retentionHours: 48

# --- 📁 WORKSPACE DIRECTORY PICKER (IN-APP BROWSER DIALOG) ---
- id: host-directory-picker-browse
  name: '@deepseek-ai/dsh-host-directory-picker-browse'

- id: ui-directory-picker-browse
  name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
