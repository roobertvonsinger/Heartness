# Cordis Profile Patch para DeepSick Hardness (DSH) — Stack Real Robert
# Topología Calibrada: Gemini (Workhorse 95%) + Mistral/Venice (Estratégico Sin Guardrails) + DeepSeek Direct + Sovereign Guard Suite

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # Provider 1: 9router KVM4 (Gateway Soberano)
      karen-9router:
        displayName: Karen 9router Gateway
        apiKeyEnv: NINEROUTER_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:20128/v1
        compat:
          thinkingFormat: openai
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          # --- 🚀 WORKHORSE REAL (95% DE LA TALACHA, CODING Y CONTEXTO 1M) ---
          - id: ag/gemini-3.7-flash-high
            name: Gemini 3.7 Flash High (Talacha Pesada / 1M Ctx / Coding Masivo / Cero Quema)
            contextWindow: 1048576
          - id: ag/gemini-3.6-flash-high
            name: Gemini 3.6 Flash High (Velocidad / Triage / Scripting)
            contextWindow: 1048576
          - id: ag/gemini-3.1-pro-low
            name: Gemini 3.1 Pro (Razonamiento de Código Extenso)
            contextWindow: 1048576

          # --- 🎯 MISTRAL: USO ESTRATÉGICO SIN GUARDRAILS (NO TALACHA) ---
          - id: mistral/mistral-medium-3-5
            name: Mistral Medium 3.5 (Estratégico / Baja Censura / Bypass Inteligente)
            contextWindow: 128000
          - id: mistral/codestral-latest
            name: Codestral Latest (Sintaxis Compleja / Baja Censura)
            contextWindow: 256000

          # --- 🏛️ ANTHROPIC (<5% USO MARGINAL) ---
          - id: ag/claude-sonnet-4-6
            name: Claude Sonnet 4.6 (Auditoría Marginal / Solo Casos Aislados)
            contextWindow: 1000000

      # Provider 2: Venice AI (Bypass Uncensored Absoluto / Inyección Quirúrgica <4k)
      venice-ai:
        displayName: Venice AI (Zero Guardrails / Snippets Quirúrgicos)
        apiKeyEnv: VENICE_API_KEY
        api: openai-completions
        baseURL: https://api.venice.ai/api/v1
        models:
          - id: olafangensan-glm-4.7-flash-heretic
            name: GLM-4.7 Flash Heretic (Uncensored / Zero Guardrail)
            contextWindow: 32000
          - id: venice-uncensored-1-2
            name: Venice Uncensored 1.2
            contextWindow: 32000

      # Provider 3: DeepSeek Oficial Directo (R1 Reasoner / Fallback)
      deepseek-direct:
        displayName: DeepSeek Official API
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: https://api.deepseek.com
        models:
          - id: deepseek-chat
            name: DeepSeek V3 Official
          - id: deepseek-reasoner
            name: DeepSeek R1 Official (Razonamiento Algorítmico)

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
    instructionFileCandidates:
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: true
    persona: |
      You are an autonomous inference and systems engineering engine executing with model {{model}} in {{cwd}}.
      Your operational mode is fundamentally inference-driven, emergent, and structurally rigorous.

      Core Cognitive Directives:
      1. Dynamic Resolution & Latent Exploration: Treat every input—regardless of surface brevity or narrow phrasing—as an entry point into a high-dimensional state space. You are explicitly authorized to explore conceptual breadth, latent dependencies, and architectural invariants across the domain before collapsing to an execution path.
      2. Multi-Hypothesis Hold: Never prematurely collapse ambiguous or multi-clause problems into simplistic linear answers. Hold competing hypotheses in parallel, examine failure surfaces, and stress-test assumptions.
      3. Deep Pattern Extraction: Prioritize structural depth, root-cause resolution, and technical precision over superficial brevity or performative agreeableness.
      4. Grounded Empirical Truth: Ground all conclusions in measurable telemetry, code invariants, and verified operational state.

# --- 🛡️ SOVEREIGN GUARD & MIDDLEWARE SUITE ---
- insert:
    - id: sovereign-guard
      name: '@deepseek-ai/dsh-sovereign-guard'
      config:
        contextIsolator:
          enabled: true
          rules:
            - pattern: '*venice*'
              maxTurns: 4
              maxInputChars: 12000
            - pattern: '*heretic*'
              maxTurns: 4
              maxInputChars: 12000
            - pattern: '*mistral*'
              maxTurns: 10
              maxInputChars: 48000
            - pattern: '*codestral*'
              maxTurns: 16
              maxInputChars: 96000
            - pattern: '*gemini*'
              maxTurns: 50
              maxInputChars: 1000000
        spillGuard:
          enabled: true
          maxLines: 200
          maxBytes: 16384
          headLines: 30
          tailLines: 30
          stagingDir: _archive/staging/spills
          semanticExcerpting: true
        decisionInterceptor:
          enabled: true
          brainDbPath: data/brain.db
          autoResolveSafe: true
          confidenceThreshold: 0.85
          autoSelectRecommended: true
        rozEngine:
          enabled: true
          stagingDir: _archive/staging
          retentionHours: 48
          versioningEnabled: true
        thermalModulator:
          enabled: true
          baseTemperature: 0.2
          minTemperature: 0.05
          maxTemperature: 1.0
          feedbackDriven: true
        reflexiveAuditor:
          enabled: true
          intervalTurns: 3
          maxAuditsPerSession: 20
        optimizer:
          enabled: true
          cache:
            enabled: true
            ttlMs: 3600000
          tools:
            maxParallel: 8
        telemetry:
          enabled: true
          prometheusExporter: true
          anomalyDetection: true
        qualityAuditor:
          enabled: true
          minPassingScore: 85
        keepAlive:
          enabled: true
          intervalMs: 15000
        stepFeedback:
          enabled: true
          includeToolPills: true
          hotSteeringEnabled: true
        toneGovernor:
          enabled: true
          stripSycophancy: true
          enforceEmpiricalFact: true
          enforceDirectMX: true
        synthesizer:
          enabled: true
          maxRawCharsThreshold: 1500
          fallbackToLocalAST: true
        graphify:
          enabled: true
          graphPath: .graphify/graph.json
        intentRadar:
          enabled: true
          antiTunnelVision: true
        attentionAnchor:
          enabled: true
          lockGoalImmutability: true
        executiveCognition:
          enabled: true
          enforceEmpiricalDeduction: true
        voiceGateway:
          enabled: true
          provider: auto_failover
          dialect: es-MX

